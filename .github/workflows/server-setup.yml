name: Provision the release server

# 一次性把发布服务器准备好：装 caddy、写站点配置、建站点目录、装 vsftpd 并建上传账号。
# 置备脚本可重复执行，改过 packaging/server/** 之后可以再跑一次。
# One-shot setup for the release server: install caddy, write the site config, create the
# site tree, install vsftpd and create the upload account. The script is idempotent, so
# it is safe to run again after packaging/server/** changes.
#
# 为什么不是每次发布都顺手置备：这台服务器一旦就绪，之后只有上传需要凭据，root SSH
# 只在需要改服务器配置时才用。
# Why not provision on every release: once the server is ready only the upload needs
# credentials, so root SSH is reserved for the runs that actually change the server.

on:
  workflow_dispatch:
    inputs:
      site_domain:
        description: 站点域名 / site domain
        default: sb.kejizero.xyz
        required: true
      webroot:
        description: 站点根目录 / webroot
        default: /var/www/sb.kejizero.xyz
        required: true

permissions:
  contents: read

# 地址与登录名来自仓库变量，不写进仓库，所以换一台服务器只是改设置，不用发一次提交。
# 两个变量都必填：缺了不会退回某个默认机器，而是直接失败，免得把源传到别人的主机上。
# The address and the login name come from repository variables rather than the repository,
# so moving to another host is a settings change instead of a commit. Both are required:
# a missing variable fails the run rather than quietly falling back to some other machine.
env:
  TZ: Asia/Shanghai
  SERVER_HOST: ${{ vars.SERVER_HOST }}
  SERVER_USER: ${{ vars.SERVER_USER }}

jobs:
  provision:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      # 口令通过标准输入交给远端 bash，不进任何一端的进程列表。脚本内容同样走 stdin。
      # The password reaches the remote bash over stdin and never lands in a process list
      # on either side; the script itself travels the same way.
      - name: 在服务器上执行置备脚本
        env:
          SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_DOMAIN: ${{ inputs.site_domain }}
          WEBROOT: ${{ inputs.webroot }}
        run: |
          set -euo pipefail
          {
            printf 'export FTP_PASSWORD=%q\n' "$FTP_PASSWORD"
            printf 'export SITE_DOMAIN=%q\n' "$SITE_DOMAIN"
            printf 'export WEBROOT=%q\n' "$WEBROOT"
            cat packaging/server/provision.sh
          } | sshpass -e ssh \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=20 \
                -o PubkeyAuthentication=no \
                -o PreferredAuthentications=password \
                "$SERVER_USER@$SERVER_HOST" bash -s
