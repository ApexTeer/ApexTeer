name: Build EasySB Go release

# 源码：根目录 Go module（main.go、internal/**）
# 产物：以 tag `v<VERSION>` 发布的一套资产：每个架构一个 .deb
#       easysb_<版本>-1_<架构>.deb，外加同一批 .deb 摆成的扁平 apt 仓库
#       （Packages / Release / InRelease / 公钥 / install.sh）。
# 软件源：GitHub Release 本身就是软件源，根地址是
#         https://github.com/EasySBTeam/EasySB/releases/latest/download
# Assets: one release tagged `v<VERSION>` carrying a .deb per architecture plus a flat
# apt repository built from the same packages (Packages / Release / InRelease / keyring /
# install.sh). The release itself is the apt source, rooted at
# https://github.com/EasySBTeam/EasySB/releases/latest/download.

on:
  push:
    branches:
      - master
    paths:
      - 'main.go'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'release/TAGS'
      - 'Makefile'
      - 'packaging/**'
      - 'scripts/**'
      - 'install.sh'
      - '.github/workflows/easysb-go-release.yml'
  # A pull request runs the same gate as a push. The job that publishes - release - is held
  # back to a push, so nothing is published from a branch, but the check, the cross-compile
  # and the packaging all run before the merge rather than after it.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# 默认只读：release 作业自己声明 contents: write。
# Read-only by default; the release job declares contents: write for itself.
permissions:
  contents: read

# Only the newest commit may publish. The group is per-ref so every push to master
# shares one group while each pull request gets its own.
concurrency:
  group: easysb-go-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  # 架构矩阵来自 Makefile 的 `release-matrix`，这样发布架构清单只有一处定义。测试也
  # 只在这里跑一次，不用每个架构各跑一遍。
  # The arch matrix comes from the Makefile's `release-matrix`, so the release arch list
  # has one definition. Tests run once here instead of once per architecture.
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      assets: ${{ steps.matrix.outputs.assets }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # 前端由 EasySB-Frontend 的 Release 承载，和 go build 是两套工具链：这里把它取进
      # public/dist 供 go:embed，本仓库因此不装 Node，也不提交编译产物。
      # The front end is carried by an EasySB-Frontend release and is a separate toolchain
      # from go build: this fetches it into public/dist for go:embed, so this repository
      # installs no Node and commits no built SPA.
      - name: 获取面板前端
        # 前端只在真正出包时取：PR 上还没有可依赖的面板 Release，make check 用占位
        # README 即可，不该因为前端尚未发布而挡住 PR。
        # The bundle is fetched only for a real build: a pull request has no panel release
        # to depend on, and make check is happy with the placeholder README, so a missing
        # front-end release must not block a PR.
        if: github.event_name != 'pull_request'
        run: make panel
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 构建标签、LD 标志、架构映射都只在 Makefile / release/TAGS 里定义一次：
      # make check 读 release/TAGS 的标签，make dist-asset 读同一处并盖上提交号。
      # Tags, link flags and the arch mapping live once, in the Makefile and
      # release/TAGS: make check reads the tags, make dist-asset reads the same file.
      - name: 提交前关卡
        run: make check

      # 竞态检测单独一步：它让整套测试慢上几倍，而它要查的是记账循环、订阅服务这类并发
      # 代码，所以不塞进 make check，留给关卡保持快。
      # The race detector gets its own step: it multiplies the suite's runtime, and what
      # it looks for lives in the concurrent code, so it is not folded into make check.
      - name: 竞态检测
        run: make test-race

      - name: 生成架构矩阵
        id: matrix
        run: echo "assets=$(make release-matrix)" >> "$GITHUB_OUTPUT"

      - name: 读取版本
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # 版本号是发布的唯一标识：包版本只有 <VERSION>-1（Makefile 的 fpm -v/--iteration
      # 与 packaging/repo/index.sh 的 debver），所以同一个 tag 再发一次，会让同名资产
      # 变成不同字节，而 apt 比较版本号后不会升级——修复后的字节永远到不了已装
      # <VERSION>-1 的机器，用户也没有该升级的信号。VERSION 未变而 tag 已存在时在这里
      # 停下，要求显式升版。
      #
      # 放在 prepare 里、读取版本之后：任何构建或上传之前，成本是一次 API 读取。
      #
      # The version is the release's only identifier: the package version is just
      # <VERSION>-1 (fpm -v/--iteration in the Makefile and debver in
      # packaging/repo/index.sh), so re-publishing a tag replaces same-named assets with
      # different bytes while apt, comparing versions, declines to upgrade - the fixed
      # bytes never reach a host that already has <VERSION>-1, and the user gets no
      # signal that they should. Stop here when VERSION has not moved but its tag exists.
      #
      # It sits in prepare, after the version is read: before any build or upload, at the
      # cost of one API read.
      - name: 防止重复发布同一版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.ver.outputs.version }}"
          errf="$(mktemp)"
          trap 'rm -f "$errf"' EXIT

          # 先按 ref 读，而不是查 release：release 可能已被清理策略收走，而 tag 本身
          # 才是"这个版本是否发布过"的判据。失败关闭：只有明确的 404 才算"不存在"，
          # 其余（限流、鉴权、网络、格式变化）一律停下，绝不因 API 抖动而盲发。
          # Read the ref rather than the release: the prune step can retire a release while
          # its tag survives, and the tag is what decides whether this version shipped.
          # Fail closed: only an explicit 404 means "absent"; anything else (rate limit,
          # auth, network, a changed response shape) stops the run instead of publishing
          # blind on a transient API error.
          if ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
                       --jq '"[\(.object.type)]\(.object.sha)"' 2>"$errf")"; then
            :
          elif grep -qE 'HTTP 404|Not Found' "$errf"; then
            # 只有 API 明确回答"没有这个 ref"才是首发。判断按整行匹配错误输出，而不是
            # 只看是否出现 "404"，避免响应体里的其它数字造成误判。
            # Only an explicit "no such ref" from the API means a first publish. The match
            # is anchored to the error output rather than looking for "404" anywhere, so a
            # stray number cannot be mistaken for it.
            echo "首次发布 $tag / first publish"
            exit 0
          else
            echo "::error::无法确认 $tag 是否存在，拒绝发布 / cannot confirm whether $tag exists: $(cat "$errf")"
            exit 1
          fi

          objtype="${ref%%]*}"; objtype="${objtype#[}"
          sha="${ref##*]}"

          # 只认 commit 与 tag 两种：ref 指向别的东西（tree 等）说明响应不是预期形状，
          # 此时不能把它的 sha 当提交比对，否则会给出"升版"这种错误的处置建议。
          # Only `commit` and `tag` are recognised: anything else (a tree, say) means the
          # response is not the shape expected, and treating its sha as a commit would
          # advise the wrong remedy.
          if [ "$objtype" != "commit" ] && [ "$objtype" != "tag" ]; then
            echo "::error::$tag 指向未知对象类型 '$objtype' / $tag points at an unexpected object type"
            exit 1
          fi

          # git/ref/tags 对注记标签返回标签对象自身的 sha，对轻量标签返回提交 sha。
          # 注记标签要再解引用一次，否则会把标签对象的 sha 错当成目标提交，同提交重试
          # 会被误拒。
          # git/ref/tags returns the tag object's own sha for an annotated tag and the
          # commit sha for a lightweight one. An annotated tag needs one more dereference,
          # or the tag object's sha is mistaken for the target commit and a legitimate
          # same-commit retry is refused.
          if [ "$objtype" = "tag" ]; then
            if ! sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha' 2>"$errf")"; then
              echo "::error::$tag 是注记标签但无法解引用 / $tag is an annotated tag that cannot be dereferenced: $(cat "$errf")"
              exit 1
            fi
          fi

          # 只接受 40 位十六进制：结果无法识别时按失败关闭处理。
          # Accept only a 40-hex sha; an unrecognised result fails closed.
          case "$sha" in
            *[!0-9a-f]*) echo "::error::$tag 的目标提交无法识别 / cannot resolve $tag to a commit: $sha"; exit 1 ;;
          esac
          if [ "${#sha}" -ne 40 ]; then
            echo "::error::$tag 的目标提交无法识别 / cannot resolve $tag to a commit: $sha"
            exit 1
          fi

          # 已存在：只有指向本次提交的重跑才放行，这样上传失败后可以安全重试。
          # Exists: only a retry of this very commit may continue, so a failed upload stays
          # recoverable without a pointless version bump.
          if [ "$sha" = "$GITHUB_SHA" ]; then
            echo "$tag 已存在且指向本次提交，视为重跑 / $tag already points at this commit, continuing as a retry"
            exit 0
          fi
          echo "::error::$tag 已存在（$sha），需升版后才能发布 / $tag already exists at $sha; bump VERSION to publish"
          exit 1

  # 每个架构一个作业：从一棵暂存树出来一个 .deb。二进制由 --print-unit 打印的 systemd
  # 单元、UPX 压缩后的可执行文件都在这一棵树上，安装进系统的单元与面板运行时写下的完全
  # 一致，不存在第二处定义。
  # One job per architecture: one .deb from one staging tree. The systemd units printed by
  # --print-unit and the UPX-compressed executable both come from that tree, so the
  # packaged unit matches the runtime one and there is no second definition.
  build:
    needs: prepare
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.prepare.outputs.assets) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # 每个架构作业都从同一棵暂存树出包，所以这里也要先把前端取进来：make packages-asset
      # 里的 go build 会用 go:embed 把它打进二进制。
      # Every arch job builds from its own staging tree, so each fetches the bundle here:
      # the go build inside make packages-asset embeds it into the binary.
      - name: 获取面板前端
        # 同 prepare：PR 只需要编译通过，前端放进来的前提是它已经发布过。
        # Same as prepare: a PR only needs the build to compile, and the bundle is only
        # present once a panel release exists.
        if: github.event_name != 'pull_request'
        run: make panel
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # UPX 缺失时 pkg-stage 会原样打包，构建不会失败；这里装上是为了让发布包稳定地小。
      # pkg-stage packages the binary as built when UPX is missing, so the build does not
      # depend on it; installing it here just keeps the published package reliably small.
      - name: 安装打包工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl

      - name: 安装 fpm
        run: sudo gem install --no-document fpm

      - name: 构建并打包 linux/${{ matrix.asset }}
        run: make packages-asset ASSET=${{ matrix.asset }} COMMIT=${GITHUB_SHA}

      - name: 上传安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: easysb-package-${{ matrix.asset }}
          path: dist/*.deb
          if-no-files-found: error

  # 一个 release 装下全部资产：tag 与 release 名都是 v<版本>，与 sing-box 一致。除了每个
  # 架构的 .deb，还附上同一批 .deb 摆成的扁平 apt 仓库，release 本身就是软件源。
  # 发布只保留最新一个 release；上传完再把旧的连同 tag 一起收走，Release 页始终只剩当前版本。
  # One release carries every asset, tagged and named v<version>, matching sing-box. Besides
  # a .deb per architecture it carries a flat apt repository built from the same packages, so
  # the release is the apt source. Only the newest release is kept: after the upload the stale
  # releases and their tags are pruned, so the Release page only ever shows the current version.
  release:
    if: github.event_name != 'pull_request'
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 下载全部产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: easysb-package-*
          path: dist
          merge-multiple: true

      # apt-ftparchive 来自 apt-utils。
      # apt-ftparchive ships in apt-utils.
      - name: 安装索引工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils

      # 私钥可以带口令：导入不需要口令，签名时从 GPG_PASSPHRASE_FILE 读，口令不进 argv。
      # 没有 GPG_PRIVATE_KEY 就直接失败：未签名的源不是 install.sh 能用的源。
      # The private key may be passphrase protected: importing needs no passphrase, and
      # signing reads it from GPG_PASSPHRASE_FILE, so it never reaches the process list.
      # Missing GPG_PRIVATE_KEY fails the run: an unsigned source is not one install.sh can use.
      - name: 导入签名密钥
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::缺少 GPG_PRIVATE_KEY，软件源无法签名 / missing GPG_PRIVATE_KEY"
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          echo "GPG_KEY_ID=$fingerprint" >> "$GITHUB_ENV"
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg.pass"
            chmod 600 "$RUNNER_TEMP/gpg.pass"
            echo "GPG_PASSPHRASE_FILE=$RUNNER_TEMP/gpg.pass" >> "$GITHUB_ENV"
          fi

      # 把同一批 .deb 摆成扁平 apt 仓库并签名到 dist/repo：Packages、Release、InRelease、
      # Release.gpg、公钥与 install.sh 全在同一层，release 直接承载，无需 Pages。
      # Lay the same .deb files out as a flat apt repository and sign it into dist/repo:
      # Packages, Release, InRelease, Release.gpg, the keyring and install.sh all sit in one
      # directory that the release serves verbatim, with no Pages involved.
      - name: 组装并签名软件源
        run: make repo GPG_KEY_ID="$GPG_KEY_ID" GPG_PASSPHRASE_FILE="${GPG_PASSPHRASE_FILE:-}"

      - name: 发布到 Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          make_latest: true
          body: |
            > EasySB v${{ needs.prepare.outputs.version }}

            - 项目地址 / Homepage: https://github.com/EasySBTeam/EasySB
            - 内核 / Core: sing-box 已编译进面板（来源 https://github.com/SagerNet/sing-box），无需单独安装
              the sing-box core is compiled into the panel, nothing to install separately

            一键安装 / One-click（Debian 12+ / Ubuntu 24.04+，自动配好签名软件源并安装）:

             ```bash
            curl -fsSL https://github.com/EasySBTeam/EasySB/releases/latest/download/install.sh | sudo bash
            ```

            手动安装 / Manual: 下载本页对应架构的 `.deb`，或先用 `apt` 配好软件源：

             ```bash
            sudo apt update && sudo apt install easysb
            ```
          files: |
            dist/repo/*

      # action-gh-release 只覆盖同名文件，改过命名之后旧资产会一直躺在 release 里。
      # 放在上传之后清理，上传万一失败时上一轮的资产还在。
      # action-gh-release only overwrites same-named files, so old assets linger after a
      # rename; pruning after the upload keeps the previous assets if the upload fails.
      - name: 清理旧资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="v${{ needs.prepare.outputs.version }}"
          keep="$(ls -1 dist/repo/* | xargs -n1 basename | sort)"
          printf '本轮资产 / current assets:\n%s\n' "$keep"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if printf '%s\n' "$keep" | grep -qxF "$name"; then
              continue
            fi
            echo "删除 / pruning: $name"
            gh release delete-asset "$version" "$name" --yes
          done < <(gh release view "$version" --json assets --jq '.assets[].name')

      # 只留最新一个 release：上一版连同它的 tag 一并收走。tag 是我们自己发布的历史；
      # 删除旧 release 会同时下架它自己的软件源，但 `latest` 始终指向最新那一个（正是
      # install.sh 与已有机器上的源配置所用的地址），所以升级路径不受影响。
      # Keep only the newest release: the previous one and its tag go together. The tag is
      # our own publishing history; deleting an old release also retires its own apt source,
      # but `latest` always points at the newest one, which is the address install.sh and
      # already-configured machines use, so the upgrade path is unaffected.
      - name: 清理旧 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="v${{ needs.prepare.outputs.version }}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "$current" ] && continue
            echo "删除旧 release / pruning: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
