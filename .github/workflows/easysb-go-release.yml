name: Build EasySB Go release

# 源码：根目录 Go module（main.go、internal/**）
# 产物：easysb-linux-<arch> 静态二进制，以 tag `v<VERSION>` 发布
# 安装：bash install.sh（默认优先下载该 tag 下的二进制，失败时回退源码构建）

on:
  push:
    branches:
      - master
    paths:
      - 'main.go'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'release/TAGS'
      - 'Makefile'
      - 'packaging/**'
      - 'install.sh'
      - '.github/workflows/easysb-go-release.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only the newest commit may publish, so an older run can never overwrite the
# release assets after a newer one.
concurrency:
  group: easysb-go-release
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  # 架构矩阵来自 Makefile 的 `release-matrix`，这样发布架构清单只有一处定义。测试也
  # 只在这里跑一次，不用每个架构各跑一遍。
  # The arch matrix comes from the Makefile's `release-matrix`, so the release arch list
  # has one definition. Tests run once here instead of once per architecture.
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      assets: ${{ steps.matrix.outputs.assets }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 构建标签、LD 标志、架构映射都只在 Makefile / release/TAGS 里定义一次：
      # make test 读 release/TAGS 的标签，make dist-asset 读同一处并盖上提交号。
      # Tags, link flags and the arch mapping live once, in the Makefile and
      # release/TAGS: make test reads the tags, make dist-asset reads the same file.
      - name: 单元测试
        run: make test

      - name: 生成架构矩阵
        id: matrix
        run: echo "assets=$(make release-matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.prepare.outputs.assets) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译 linux/${{ matrix.asset }}
        run: make dist-asset ASSET=${{ matrix.asset }} COMMIT=${GITHUB_SHA}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: easysb-linux-${{ matrix.asset }}
          path: dist/easysb-linux-${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [build, packages]
    runs-on: ubuntu-26.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 读取版本
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.ver.outputs.version }}
          name: EasySB Go v${{ steps.ver.outputs.version }}
          make_latest: false
          body: |
            > EasySB Go v${{ steps.ver.outputs.version }} 二进制 / binaries

            - 项目地址 / Homepage: https://github.com/MinimaxFlora/EasySB
            - 内核 / Core: sing-box 已编译进面板（来源 https://github.com/SagerNet/sing-box），无需单独安装
              the sing-box core is compiled into the panel, nothing to install separately

            安装 / Install:

             ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/MinimaxFlora/EasySB/master/install.sh)
            ```

            Debian / Ubuntu 可以用 .deb 或 apt 源安装；Fedora / RHEL / openSUSE 与 Arch
            可以下载 .rpm / pacman 包直接安装。写法见 README。
            Debian / Ubuntu can install the .deb or add the apt repository; Fedora / RHEL /
            openSUSE and Arch can download the .rpm / pacman package directly. See the README.
          files: |
            dist/easysb-linux-*
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  # 每个架构只跑一个作业，三种包（.deb / .rpm / pacman）都从同一棵暂存树出来：
  # 同一个二进制、同一段由二进制自己打印（--print-unit）的 systemd 单元，所以安装
  # 进系统的单元与面板运行时写下的完全一致，不存在第二处定义。Arch 没有 i386 与
  # s390x，pacman-asset 只对 Arch 支持的架构出包。
  # One job per architecture builds all three formats from one staging tree: one binary
  # and one systemd unit text printed by the binary itself (--print-unit), so the
  # packaged unit matches the runtime one. Arch has no i386 or s390x, so the pacman
  # package is only produced for the architectures Arch ships.
  packages:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.prepare.outputs.assets) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 下载该架构的二进制
        uses: actions/download-artifact@v8
        with:
          name: easysb-linux-${{ matrix.asset }}
          path: dist

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # rpm 目标要 rpmbuild，pacman 目标要 bsdtar（libarchive-tools）。
      # The rpm target needs rpmbuild; the pacman target needs bsdtar.
      - name: 安装打包工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm libarchive-tools

      - name: 安装 fpm
        run: sudo gem install --no-document fpm

      - name: 打包三种格式
        run: make packages-asset ASSET=${{ matrix.asset }} REUSE_DIST=1 COMMIT=${GITHUB_SHA}

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: easysb-packages-${{ matrix.asset }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # apt 源放在固定标签 `debian` 上：URIs 必须稳定，所以索引和 .deb 都发布到该
  # 标签，而不是每个版本一个标签。索引每次重建，只列出本次发布的版本。
  # The apt repository lives on the fixed `debian` tag: apt needs a stable URI, so the
  # index and the .deb files publish there. The index is rebuilt every run and lists
  # only the version this run produced.
  repo:
    needs: packages
    runs-on: ubuntu-26.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 下载全部 .deb
        uses: actions/download-artifact@v8
        with:
          pattern: easysb-packages-*
          path: dist
          merge-multiple: true

      - name: 安装 apt 索引工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils

      # 没有配置 GPG_PRIVATE_KEY 时索引保持未签名，README 里给出对应的 trusted=yes
      # 源写法；配置后自动签名，可用 Signed-By 的写法。
      # Without GPG_PRIVATE_KEY the index stays unsigned and the README documents the
      # trusted=yes form; with it the index is signed and the Signed-By form works.
      - name: 导入签名密钥（可选）
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
            fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
            echo "GPG_KEY_ID=$fingerprint" >> "$GITHUB_ENV"
          fi

      - name: 生成 apt 源索引
        run: make apt-index GPG_KEY_ID="${GPG_KEY_ID:-}"

      - name: 发布到 debian 源
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: debian
          name: EasySB apt repository
          make_latest: false
          overwrite_files: true
          body: |
            > EasySB apt 源 / apt repository

            添加软件源后即可 `apt install easysb`，写法见项目 README。
            Add the sources entry from the README, then `apt install easysb`.

            该标签只承载 apt 索引与 .deb，不带版本历史；二进制仍在 `v<VERSION>` 标签。
            This tag only carries the apt index and .deb files; binaries stay on `v<VERSION>`.
          files: dist/apt/*
