name: Build EasySB Go release

# 源码：根目录 Go module（main.go、internal/**）
# 产物：以 tag `v<VERSION>` 发布的一套资产 —— 每个架构一个 .deb
#       easysb_<版本>-1_<架构>.deb
# 软件源：同一批 .deb 摆成一棵标准 apt 树（pool / dists），GPG 签名后由 GitHub Pages
#         原样发布在站点根，一键安装在 https://sb.kejizero.xyz/install.sh。
# Assets: one release tagged `v<VERSION>` carrying a .deb per architecture. The same
# packages are laid out as a plain apt tree, signed with GPG and published verbatim by
# GitHub Pages, so the one-command install lives at https://sb.kejizero.xyz/install.sh.

on:
  push:
    branches:
      - master
    paths:
      - 'main.go'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'release/TAGS'
      - 'Makefile'
      - 'packaging/**'
      - 'install.sh'
      - '.github/workflows/easysb-go-release.yml'
  # A pull request runs the same gate as a push. The jobs that publish - release and
  # pages - are held back to a push, so nothing is published from a branch, but the
  # check, the cross-compile and the packaging all run before the merge rather than
  # after it.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# 默认只读：release 作业自己声明 contents: write，pages 作业自己声明 pages / id-token。
# Read-only by default; the release job declares contents: write and the pages job
# declares pages / id-token for itself.
permissions:
  contents: read

# Only the newest commit may publish. The group is per-ref so every push to master
# shares one group while each pull request gets its own.
concurrency:
  group: easysb-go-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  # 架构矩阵来自 Makefile 的 `release-matrix`，这样发布架构清单只有一处定义。测试也
  # 只在这里跑一次，不用每个架构各跑一遍。
  # The arch matrix comes from the Makefile's `release-matrix`, so the release arch list
  # has one definition. Tests run once here instead of once per architecture.
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      assets: ${{ steps.matrix.outputs.assets }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # 构建标签、LD 标志、架构映射都只在 Makefile / release/TAGS 里定义一次：
      # make check 读 release/TAGS 的标签，make dist-asset 读同一处并盖上提交号。
      # Tags, link flags and the arch mapping live once, in the Makefile and
      # release/TAGS: make check reads the tags, make dist-asset reads the same file.
      - name: 提交前关卡
        run: make check

      # 竞态检测单独一步：它让整套测试慢上几倍，而它要查的是记账循环、订阅服务这类并发
      # 代码，所以不塞进 make check，留给关卡保持快。
      # The race detector gets its own step: it multiplies the suite's runtime, and what
      # it looks for lives in the concurrent code, so it is not folded into make check.
      - name: 竞态检测
        run: make test-race

      - name: 生成架构矩阵
        id: matrix
        run: echo "assets=$(make release-matrix)" >> "$GITHUB_OUTPUT"

      - name: 读取版本
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  # 每个架构一个作业：从一棵暂存树出来一个 .deb。二进制由 --print-unit 打印的 systemd
  # 单元、UPX 压缩后的可执行文件都在这一棵树上，安装进系统的单元与面板运行时写下的完全
  # 一致，不存在第二处定义。
  # One job per architecture: one .deb from one staging tree. The systemd units printed by
  # --print-unit and the UPX-compressed executable both come from that tree, so the
  # packaged unit matches the runtime one and there is no second definition.
  build:
    needs: prepare
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.prepare.outputs.assets) }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # UPX 缺失时 pkg-stage 会原样打包，构建不会失败；这里装上是为了让发布包稳定地小。
      # pkg-stage packages the binary as built when UPX is missing, so the build does not
      # depend on it; installing it here just keeps the published package reliably small.
      - name: 安装打包工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl

      - name: 安装 fpm
        run: sudo gem install --no-document fpm

      - name: 构建并打包 linux/${{ matrix.asset }}
        run: make packages-asset ASSET=${{ matrix.asset }} COMMIT=${GITHUB_SHA}

      - name: 上传安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: easysb-package-${{ matrix.asset }}
          path: dist/*.deb
          if-no-files-found: error

  # 一个 release 装下全部 .deb：tag 与 release 名都是 v<版本>，与 sing-box 一致。
  # 发布只保留最新一个 release；上传完再把旧的连同 tag 一起收走，Release 页始终只剩当前版本。
  # One release carries every .deb, tagged and named v<version>, matching sing-box. Only
  # the newest release is kept: after the upload the stale releases and their tags are
  # pruned, so the Release page only ever shows the current version.
  release:
    if: github.event_name != 'pull_request'
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: easysb-package-*
          path: dist
          merge-multiple: true

      - name: 发布到 Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          make_latest: true
          body: |
            > EasySB v${{ needs.prepare.outputs.version }}

            - 项目地址 / Homepage: https://github.com/MinimaxFlora/EasySB
            - 内核 / Core: sing-box 已编译进面板（来源 https://github.com/SagerNet/sing-box），无需单独安装
              the sing-box core is compiled into the panel, nothing to install separately

            一键安装 / One-click（Debian 12+ / Ubuntu 24.04+，自动配好签名软件源并安装）:

             ```bash
            curl -fsSL https://sb.kejizero.xyz/install.sh | sudo bash
            ```

            手动安装 / Manual: 下载本页对应架构的 `.deb`，或先用 `apt` 配好软件源：

             ```bash
            sudo apt update && sudo apt install easysb
            ```
          files: |
            dist/*.deb

      # action-gh-release 只覆盖同名文件，改过命名之后旧资产会一直躺在 release 里。
      # 放在上传之后清理，上传万一失败时上一轮的资产还在。
      # action-gh-release only overwrites same-named files, so old assets linger after a
      # rename; pruning after the upload keeps the previous assets if the upload fails.
      - name: 清理旧资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="v${{ needs.prepare.outputs.version }}"
          keep="$(ls -1 dist/*.deb | xargs -n1 basename | sort)"
          printf '本轮资产 / current assets:\n%s\n' "$keep"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if printf '%s\n' "$keep" | grep -qxF "$name"; then
              continue
            fi
            echo "删除 / pruning: $name"
            gh release delete-asset "$version" "$name" --yes
          done < <(gh release view "$version" --json assets --jq '.assets[].name')

      # 只留最新一个 release：上一版连同它的 tag 一并收走。tag 是我们自己发布的历史，
      # 删掉不影响任何仍在使用的软件源（源由 Pages 承载）。
      # Keep only the newest release: the previous one and its tag go together. The tag is
      # our own publishing history, and the sources live on Pages, so removing it breaks
      # nothing that is still in use.
      - name: 清理旧 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="v${{ needs.prepare.outputs.version }}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "$current" ] && continue
            echo "删除旧 release / pruning: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

  # 把同一批 .deb 组装成 apt 树并签名，交给 GitHub Pages 发布：pool 一份、dists/<套件>
  # 按发行版分，公钥与 install.sh 在站点根。caddy 风格的落点对应
  # /usr/share/keyrings/easysb-archive-keyring.gpg + /etc/apt/sources.list.d/easysb.list。
  # Lays the same .deb files out as a signed apt tree and hands it to GitHub Pages: one
  # shared pool, per-release dists/<suite>, and the public key plus install.sh at the site
  # root. The caddy-style drop points are /usr/share/keyrings/easysb-archive-keyring.gpg
  # and /etc/apt/sources.list.d/easysb.list.
  #
  # 同样是 push 才发布：分支上的任何一次提交都不该碰生产站点。
  # Also push-only: nothing on a branch may reach the production site.
  pages:
    if: github.event_name != 'pull_request'
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 下载全部产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: easysb-package-*
          path: dist
          merge-multiple: true

      # apt-ftparchive 来自 apt-utils。
      # apt-ftparchive ships in apt-utils.
      - name: 安装索引工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils

      # 私钥可以带口令：导入不需要口令，签名时从 GPG_PASSPHRASE_FILE 读，口令不进 argv。
      # The private key may be passphrase protected: importing needs no passphrase, and
      # signing reads it from GPG_PASSPHRASE_FILE, so it never reaches the process list.
      - name: 导入签名密钥
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::缺少 GPG_PRIVATE_KEY，软件源无法签名 / missing GPG_PRIVATE_KEY"
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          echo "GPG_KEY_ID=$fingerprint" >> "$GITHUB_ENV"
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg.pass"
            chmod 600 "$RUNNER_TEMP/gpg.pass"
            echo "GPG_PASSPHRASE_FILE=$RUNNER_TEMP/gpg.pass" >> "$GITHUB_ENV"
          fi

      - name: 组装并签名软件源
        run: make repo GPG_KEY_ID="$GPG_KEY_ID" GPG_PASSPHRASE_FILE="${GPG_PASSPHRASE_FILE:-}"

      # Pages 默认跑 Jekyll，会跳过一些以点或下划线开头的路径；.nojekyll 关掉它。CNAME
      # 把站点固定在自定义域上，install.sh 里那个地址才成立。
      # Pages runs Jekyll by default and skips some dot/underscore paths; .nojekyll turns
      # that off. CNAME pins the site to the custom domain install.sh points at.
      - name: 站点文件
        run: |
          set -euo pipefail
          touch dist/repo/.nojekyll
          printf 'sb.kejizero.xyz\n' > dist/repo/CNAME

      - name: 配置 Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/repo

      - name: 发布到 Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
