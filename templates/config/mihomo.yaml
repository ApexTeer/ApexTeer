# EasySB mihomo (Clash Meta) subscription - readable mirror.
#
# This is sample output of internal/subscribe/mihomo.yaml after rendering; keep
# it in sync with the embedded template. The live file is generated per node.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
external-controller: 127.0.0.1:9090
secret: "per-account-generated"   # 由面板按账号派生，不是固定值
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

dns:
  enable: true
  listen: "0.0.0.0:1053"
  ipv6: true
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: "arc"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "localhost.work.weixin.qq.com"
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"

proxies:
  - name: "EasySB-AnyTLS"
    type: anytls
    server: "YOUR_SERVER"
    port: 8000
    password: "YOUR_PASSWORD"
    client-fingerprint: chrome
    udp: true
    idle-session-check-interval: 30
    idle-session-timeout: 30
    min-idle-session: 5
    sni: "YOUR_SERVER"
    alpn:
      - h3
      - h2
      - http/1.1
    skip-cert-verify: false
  - name: "EasySB-Hysteria2"
    type: hysteria2
    server: "YOUR_SERVER"
    port: 8001
    ports: "2080-3000"
    password: "YOUR_PASSWORD"
    sni: "YOUR_SERVER"
    alpn:
      - h3
    up: "20 Mbps"
    down: "100 Mbps"
    hop-interval: 30
    fast-open: true
    skip-cert-verify: false
  - name: "EasySB-TUIC"
    type: tuic
    server: "YOUR_SERVER"
    port: 8002
    uuid: "YOUR_UUID"
    password: "YOUR_PASSWORD"
    sni: "YOUR_SERVER"
    alpn:
      - h3
    reduce-rtt: false
    udp-relay-mode: native
    congestion-controller: bbr
    skip-cert-verify: false
  - name: "EasySB-VMess-WS-TLS"
    type: vmess
    server: "YOUR_SERVER"
    port: 8004
    uuid: "YOUR_UUID"
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    skip-cert-verify: false
    servername: "YOUR_SERVER"
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vmess
      headers:
        Host: "YOUR_SERVER"
  - name: "EasySB-VLESS-Reality"
    type: vless
    server: "YOUR_SERVER"
    port: 8003
    uuid: "YOUR_UUID"
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: "apple.com"
    client-fingerprint: chrome
    reality-opts:
      public-key: "YOUR_REALITY_PUBLIC_KEY"
      short-id: "YOUR_REALITY_SHORT_ID"

proxy-groups:
  - name: 负载均衡
    type: load-balance
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    proxies:
      - "EasySB-AnyTLS"
      - "EasySB-Hysteria2"
      - "EasySB-TUIC"
      - "EasySB-VMess-WS-TLS"
      - "EasySB-VLESS-Reality"
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "EasySB-AnyTLS"
      - "EasySB-Hysteria2"
      - "EasySB-TUIC"
      - "EasySB-VMess-WS-TLS"
      - "EasySB-VLESS-Reality"
  - name: 🌍选择代理节点
    type: select
    proxies:
      - 负载均衡
      - 自动选择
      - DIRECT
      - "EasySB-AnyTLS"
      - "EasySB-Hysteria2"
      - "EasySB-TUIC"
      - "EasySB-VMess-WS-TLS"
      - "EasySB-VLESS-Reality"

rules:
  - GEOIP,LAN,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点
